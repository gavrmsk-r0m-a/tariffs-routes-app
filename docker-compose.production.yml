services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teleroute}
      POSTGRES_USER: ${POSTGRES_USER:-teleroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - teleroute_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db_migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["python", "scripts/apply_postgres_schema.py"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
    environment:
      DB_BACKEND: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MVP_PRODUCTION_SECURITY: "1"
      MVP_AUTH_SECRET: ${MVP_AUTH_SECRET:?MVP_AUTH_SECRET is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      HOST: "0.0.0.0"
      PORT: "8000"
      HLR_MODE: ${HLR_MODE:-demo}
      HLR_API_URL: ${HLR_API_URL:-}
      HLR_API_KEY: ${HLR_API_KEY:-}
      HLR_API_SECRET: ${HLR_API_SECRET:-}
      HLR_TIMEOUT_MS: ${HLR_TIMEOUT_MS:-30000}
      HLR_CONCURRENCY: ${HLR_CONCURRENCY:-1}
      HLR_DAILY_CHECK_LIMIT: ${HLR_DAILY_CHECK_LIMIT:-500}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

volumes:
  teleroute_postgres_data:
