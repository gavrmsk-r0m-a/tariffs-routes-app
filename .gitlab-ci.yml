stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  POSTGRES_DB: "teleroute_ci"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

  DB_BACKEND: "postgres"
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/teleroute_ci"
  POSTGRES_TEST_ADMIN_URL: "postgresql://postgres:postgres@postgres:5432/postgres"

  MVP_PRODUCTION_SECURITY: "1"
  MVP_AUTH_SECRET: "ci-only-teleroute-auth-secret-2026-at-least-32-characters"

cache:
  paths:
    - .cache/pip

teleroute_tests:
  stage: test

  image: python:3.12-slim

  services:
    - name: postgres:16
      alias: postgres

  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt

    - |
      python - <<'PY'
      import time
      import psycopg

      dsn = "postgresql://postgres:postgres@postgres:5432/teleroute_ci"

      for attempt in range(30):
          try:
              with psycopg.connect(dsn):
                  print("PostgreSQL is ready")
                  break
          except Exception:
              print(f"Waiting for PostgreSQL: {attempt + 1}/30")
              time.sleep(1)
      else:
          raise RuntimeError("PostgreSQL did not become ready")
      PY

  script:
    - python -m compileall -q app scripts
    - python -m unittest -v tests.test_production_release tests.test_ui_baseline
