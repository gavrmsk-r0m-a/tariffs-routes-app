services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: teleroute_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - teleroute_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teleroute_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teleroute_postgres_data:
