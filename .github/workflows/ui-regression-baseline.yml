name: UI Regression Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/server.py
      - tests/test_ui_baseline.py
      - docs/ui_regression_baseline.md
      - .github/workflows/ui-regression-baseline.yml

jobs:
  ui-regression-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Compile server module
        run: python -m py_compile app/server.py

      - name: Run UI structural regression baseline
        run: python -m unittest tests.test_ui_baseline -v

      - name: Check whitespace errors
        run: git diff --check
