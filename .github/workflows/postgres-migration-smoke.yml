name: PostgreSQL Migration Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/migrate_sqlite_to_postgres.py
      - scripts/postgres_preflight.py
      - scripts/postgres_repository_smoke.py
      - scripts/postgres_repository_write_harness.py
      - scripts/audit_repository_postgres_coverage.py
      - scripts/audit_repository_postgres_write_plan.py
      - scripts/audit_postgres_production_gate.py
      - scripts/postgres_final_enablement_check.py
      - scripts/postgres_runtime_enablement_smoke.py
      - scripts/postgres_full_app_smoke.py
      - tests/test_postgres_full_app_smoke.py
      - tests/test_postgres_final_enablement_gate.py
      - docs/postgres/final_enablement_runbook.md
      - docs/postgres/final_enablement_approval.md
      - app/security.py
      - app/server.py
      - tests/test_postgres_security_gate.py
      - tests/test_server_auth_security.py
      - docs/postgres/security_gate.md
      - scripts/postgres_backup.py
      - scripts/postgres_restore_verify.py
      - scripts/postgres_backup_restore_smoke.py
      - scripts/postgres_deployment_rollback_smoke.py
      - scripts/postgres_deployment_rollback_check.py
      - tests/test_postgres_backup_restore.py
      - tests/test_postgres_deployment_rollback_gate.py
      - docs/postgres/backup_restore_runbook.md
      - docs/postgres/deployment_rollback_runbook.md
      - tests/test_postgres_production_gate.py
      - tests/test_postgres_runtime_adapter.py
      - docs/postgres/production_readiness_gate.md
      - docs/postgres/runtime_adapter_plan.md
      - docs/postgres/repository_write_surface_plan.json
      - docs/postgres/repository_write_surface_plan.md
      - tests/test_repository_postgres_write_plan.py
      - docs/postgres/repository_method_coverage.json
      - docs/postgres/repository_read_surface_audit.md
      - tests/test_repository_postgres_coverage_audit.py
      - tests/test_postgres_runtime_audit.py
      - scripts/create_migration_demo_sqlite.py
      - docs/postgres/schema.postgres.sql
      - docs/postgres/schema_decisions.md
      - app/schema.sql
      - app/db.py
      - app/repository.py
      - app/db_adapter.py
      - tests/test_sqlite_to_postgres_migration.py
      - tests/test_postgres_preflight.py
      - tests/test_postgres_schema_draft.py
      - tests/test_migration_demo_sqlite.py
      - tests/test_postgres_repository_smoke.py
      - tests/test_postgres_repository_write_harness.py
      - .github/workflows/postgres-migration-smoke.yml

jobs:
  postgres-migration-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teleroute_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install "psycopg[binary]"

      - name: Run focused migration tests
        run: |
          python -m unittest tests.test_repository_postgres_coverage_audit
          python -m unittest tests.test_repository_postgres_write_plan
          python -m unittest tests.test_postgres_runtime_audit
          python -m unittest tests.test_postgres_preflight
          python -m unittest tests.test_postgres_schema_draft
          python -m unittest tests.test_sqlite_to_postgres_migration
          python -m unittest tests.test_migration_demo_sqlite
          python -m unittest tests.test_postgres_repository_smoke
          python -m unittest tests.test_postgres_repository_write_harness
          python -m unittest tests.test_postgres_production_gate
          python -m unittest tests.test_postgres_security_gate
          python -m unittest tests.test_postgres_runtime_adapter
          python -m unittest tests.test_postgres_backup_restore
          python -m unittest tests.test_postgres_deployment_rollback_gate
          python -m unittest tests.test_postgres_final_enablement_gate
          python scripts/audit_postgres_production_gate.py --format json
          python scripts/audit_postgres_production_gate.py --strict

      - name: Create demo SQLite database
        run: python scripts/create_migration_demo_sqlite.py --output "$RUNNER_TEMP/migration_demo.sqlite3"

      - name: Run PostgreSQL preflight on demo SQLite
        run: |
          python scripts/postgres_preflight.py \
            --db "$RUNNER_TEMP/migration_demo.sqlite3" \
            --schema docs/postgres/schema.postgres.sql

      - name: Run SQLite to PostgreSQL migration dry-run
        run: |
          python scripts/migrate_sqlite_to_postgres.py \
            --sqlite-db "$RUNNER_TEMP/migration_demo.sqlite3" \
            --schema docs/postgres/schema.postgres.sql \
            --dry-run

      - name: Run SQLite to PostgreSQL migration apply
        run: |
          python scripts/migrate_sqlite_to_postgres.py \
            --sqlite-db "$RUNNER_TEMP/migration_demo.sqlite3" \
            --postgres-url "postgresql://postgres:postgres@localhost:5432/teleroute_migration_test" \
            --schema docs/postgres/schema.postgres.sql \
            --apply --yes --create-schema

      - name: Run PostgreSQL backup and restore smoke
        run: |
          python scripts/postgres_backup_restore_smoke.py \
            --database-url "postgresql://postgres:postgres@localhost:5432/teleroute_migration_test" \
            --workdir "$RUNNER_TEMP/postgres-backup-restore"

      - name: Run PostgreSQL deployment rollback smoke
        run: |
          python scripts/postgres_deployment_rollback_smoke.py \
            --database-url "postgresql://postgres:postgres@localhost:5432/teleroute_migration_test" \
            --workdir "$RUNNER_TEMP/postgres-deployment-rollback" \
            --current-release-sha "$GITHUB_SHA" \
            --rollback-release-sha "d3d217eafcb5fc0a1fe52e17c195d596fd0cbaab"

      - name: Run guarded PostgreSQL runtime enablement smoke
        run: |
          python scripts/postgres_runtime_enablement_smoke.py \
            --database-url "postgresql://postgres:postgres@localhost:5432/teleroute_migration_test" \
            --auth-secret "ci-only-runtime-enable-secret-at-least-32-chars" \
            --format json

      - name: Run full-app PostgreSQL WSGI smoke
        run: |
          python scripts/postgres_full_app_smoke.py \
            --database-url "postgresql://postgres:postgres@localhost:5432/teleroute_migration_test" \
            --auth-secret "ci-only-full-app-secret-at-least-32-characters" \
            --format json

      - name: Run strict PostgreSQL final enablement check
        env:
          DB_BACKEND: postgres
          POSTGRES_RUNTIME_ENABLED: '1'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teleroute_migration_test
          MVP_PRODUCTION_SECURITY: '1'
          MVP_AUTH_SECRET: ci-only-runtime-enable-secret-at-least-32-chars
        run: |
          python scripts/postgres_final_enablement_check.py \
            --database-url "postgresql://postgres:postgres@localhost:5432/teleroute_migration_test" \
            --current-release-sha "$GITHUB_SHA" \
            --rollback-release-sha "511531f09bdf00e2ddd8df27467f5887429a6b96" \
            --backup-manifest "$RUNNER_TEMP/postgres-backup-restore/teleroute-backup.manifest.json" \
            --approval docs/postgres/final_enablement_approval.md \
            --strict \
            --format json

      - name: Run read-only PostgreSQL Repository smoke
        run: |
          python scripts/postgres_repository_smoke.py \
            --postgres-url "postgresql://postgres:postgres@localhost:5432/teleroute_migration_test"

      - name: Run rollback-only PostgreSQL Repository write harness
        run: |
          python scripts/postgres_repository_write_harness.py \
            --postgres-url "postgresql://postgres:postgres@localhost:5432/teleroute_migration_test" \
            --json
